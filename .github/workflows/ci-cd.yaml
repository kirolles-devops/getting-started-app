name: to-do

on:
    push:
        branches:
            - "main"
            - "master"

env:
    AWS_REGION: us-east-1
    TF_STATE_BUCKET: tf-state-getting-started-app

jobs:
    test_and_build:
        name: test_and_build
        runs-on: ubuntu-latest

        steps:
            - name: clone_code
              uses: actions/checkout@v5

            - name: build docker image
              run: docker build -t getting-started-app .
              

    provision:
        name: provision_with_terraform
        runs-on: ubuntu-latest
        needs: test_and_build
        outputs:
            ec2_ip: ${{ steps.get_ip.outputs.ec2_ip }}

        steps:
            - name: clone_code
              uses: actions/checkout@v5

            - name: configure aws credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}

            - name: create s3 bucket for terraform state
              run: |
                aws s3api create-bucket \
                  --bucket ${{ env.TF_STATE_BUCKET }} \
                  --region ${{ env.AWS_REGION }} || true

            - name: setup terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_wrapper: false

            - name: terraform init
              working-directory: terraform
              run: |
                terraform init \
                  -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
                  -backend-config="key=terraform.tfstate" \
                  -backend-config="region=${{ env.AWS_REGION }}"

            - name: terraform apply
              working-directory: terraform
              run: |
                terraform apply -auto-approve \
                  -var="ec2_public_key=${{ secrets.EC2_SSH_PUBLIC_KEY }}"

            - name: get ec2 ip
              id: get_ip
              working-directory: terraform
              run: |
                EC2_IP=$(terraform output -raw ec2_public_ip)
                echo "EC2 Public IP: $EC2_IP"
                echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT


    deploy:
        name: deploy_with_ansible
        runs-on: ubuntu-latest
        needs: provision

        steps:
            - name: clone_code
              uses: actions/checkout@v5

            - name: install ansible
              run: |
                sudo apt update
                sudo apt install -y ansible

            - name: create ssh key file
              run: |
                echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key.pem
                chmod 600 /tmp/ec2_key.pem

            - name: wait for ec2 to be ready
              run: sleep 30

            - name: create ansible inventory
              run: |
                echo "[ec2]" > ansible/inventory.ini
                echo "${{ needs.provision.outputs.ec2_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=/tmp/ec2_key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini

            - name: run ansible playbook
              run: |
                ansible-playbook -i ansible/inventory.ini ansible/playbook.yml \
                  --extra-vars "repo_url=https://github.com/${{ github.repository }}"

            - name: cleanup ssh key
              if: always()
              run: rm -f /tmp/ec2_key.pem